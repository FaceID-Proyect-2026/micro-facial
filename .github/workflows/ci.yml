name: FaceLit Micro Facial CI

on:
  pull_request:
  push:
    branches: [dev, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ENVIRONMENT: ci
      API_KEY: ci-only-not-a-production-key
      PRELOAD_MODEL: 'false'
      POSTGRES_DB: facelit_integration
      POSTGRES_USER: facelit_ci
      POSTGRES_PASSWORD: ci-only-disposable-password
      POSTGRES_PORT: '127.0.0.1:5439'
      DATABASE_URL: postgresql+asyncpg://facelit_ci:ci-only-disposable-password@127.0.0.1:5439/facelit_integration
      RF54_POSTGRES_TEST: '1'
    steps:
      - name: Checkout microservice
        uses: actions/checkout@v4

      - name: Checkout reviewed database schema
        uses: actions/checkout@v4
        with:
          repository: FaceID-Proyect-2026/FaceLit-DB
          ref: 74c1af01ccc8690080f746b745a037555a85547e
          path: database

      - name: Install native build and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgl1 libglib2.0-0 libgomp1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Lint Python errors
        run: python -m ruff check --select E9,F63,F7,F82 app tests

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Migrate disposable PostgreSQL with pgvector
        run: |
          mkdir -p ci-logs
          docker compose -f database/docker-compose.yml -p micro-ci up -d --wait postgres
          docker compose -f database/docker-compose.yml -p micro-ci --profile tooling run --rm liquibase validate 2>&1 | tee ci-logs/validate.log
          docker compose -f database/docker-compose.yml -p micro-ci --profile tooling run --rm liquibase update 2>&1 | tee ci-logs/update.log

      - name: Run pytest with coverage
        run: python -m pytest -q -ra --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=pytest-results.xml

      - name: Require PostgreSQL replacement test to execute
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('pytest-results.xml').getroot().iter('testcase')
          expected = [case for case in cases if case.attrib.get('name') ==
                      'test_real_postgres_replacement_consumption_and_rollback']
          assert len(expected) == 1, 'PostgreSQL integration test report is missing'
          assert not any(expected[0].find(tag) is not None for tag in
                         ('skipped', 'failure', 'error')), 'PostgreSQL integration did not pass'
          PY

      - name: Preserve PostgreSQL logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose -f database/docker-compose.yml -p micro-ci logs --no-color > ci-logs/postgres.log 2>&1

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: micro-facial-tests-and-coverage
          path: |
            coverage.xml
            pytest-results.xml
            htmlcov/
            ci-logs/
          if-no-files-found: warn

      - name: Remove disposable PostgreSQL
        if: always()
        run: docker compose -f database/docker-compose.yml -p micro-ci down --volumes --remove-orphans
